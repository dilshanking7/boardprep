<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoardPrep — Repair / साफ़ करो</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b1120;color:#e5e7eb;
       margin:0;padding:24px;line-height:1.5}
  .card{max-width:560px;margin:20px auto;background:#111827;border:1px solid #334155;border-radius:16px;padding:20px}
  h1{font-size:20px;margin:0 0 6px}
  p{color:#94a3b8;font-size:14px}
  button{display:block;width:100%;margin:10px 0;padding:14px;border:0;border-radius:12px;
         font-size:16px;font-weight:800;cursor:pointer}
  .danger{background:#dc2626;color:#fff}
  .ok{background:#16a34a;color:#fff}
  .ghost{background:#1f2937;color:#e5e7eb;border:1px solid #334155}
  #log{font-family:monospace;font-size:12px;background:#000;padding:10px;border-radius:10px;
       max-height:200px;overflow:auto;white-space:pre-wrap;color:#86efac}
</style>
</head>
<body>
<div class="card">
  <h1>BoardPrep — Repair</h1>
  <p>अगर app ठीक से नहीं खुल रहा, या पुरानी फ़ाइलें दिख रही हैं, तो यहाँ से साफ़ करो।</p>

  <button class="danger" id="b1">1) सारा डेटा साफ़ करो (सब मिटेगा)</button>
  <button class="ghost" id="b2">2) सिर्फ़ cache + पुराना SW हटाओ (प्रगति बचेगी)</button>
  <button class="ok" id="b3">3) BoardPrep खोलो</button>
  <div id="log"></div>
</div>
<script>
(function () {
  var log = document.getElementById('log');
  function say(m) { log.textContent += m + '\n'; }
  function clearStorage() {
    try { localStorage.clear(); say('localStorage: saaf'); } catch (e) { say('localStorage: nahi'); }
    try { sessionStorage.clear(); say('sessionStorage: saaf'); } catch (e) { }
    try { indexedDB.databases().then(function (dbs) {
      dbs.forEach(function (d) { try { indexedDB.deleteDatabase(d.name); } catch (e) { } });
      say('IndexedDB: saaf');
    }); } catch (e) { say('IndexedDB: nahi mila'); }
  }
  function clearCache() {
    try {
      if (navigator.serviceWorker) {
        navigator.serviceWorker.getRegistrations().then(function (rs) {
          rs.forEach(function (r) { r.unregister(); });
          say('Service Worker: hataya');
        });
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (ks) {
          ks.forEach(function (k) { caches.delete(k); });
          say('Cache: ' + ks.length + ' hati');
        });
      }
    } catch (e) { say('cache: nahi'); }
  }
  document.getElementById('b1').onclick = function () {
    clearStorage(); clearCache(); say('— ho gaya. Ab BoardPrep kholo.');
  };
  document.getElementById('b2').onclick = function () {
    clearCache(); say('— cache saaf. Ab BoardPrep kholo.');
  };
  document.getElementById('b3').onclick = function () { location.href = 'index.html'; };
})();
</script>
</body>
</html>
