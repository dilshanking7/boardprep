name = "boardprep-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Free model (Nous Portal) — longcat-2.5:free
[vars]
MODEL = "meituan/longcat-2.5:free"
INFERENCE_BASE_URL = "https://inference-api.nousresearch.com/v1"
NOUS_PORTAL = "https://portal.nousresearch.com"
SUPABASE_URL = "https://qssxnilqflpzlyflfoqk.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_5Kto_b2Fmp4SRww7qvPaeA_SetAlfDV"

# rate limit — 60 AI requests per logged-in user, 24 hour window
LIMIT_PER = "60"
WINDOW_HOURS = "24"

# security — sirf yahi origins API call kar sakte hain ('*' nahi).
# localhost kisi bhi port par allowed (code me regex), APK origin bhi included.
ALLOWED_ORIGINS = "https://dilshanking7.github.io,http://localhost,http://127.0.0.1,https://appassets.androidplatform.net,http://appassets.androidplatform.net"

# free keys (optional — jo mile daalo, chain apne-aap use karegi)
# GROQ_KEY, GEMINI_KEY, OPENROUTER_KEY  -> wrangler secret ya vars me
# NOUS_TOKEN, NOUS_REFRESH_TOKEN, NOUS_CLIENT_ID -> wrangler secret (D1 se better)
# DIAG_TOKEN -> optional; set karne par hi /api/diag chalega

# Cloudflare Workers AI (free — CF account chahiye)
[ai]
binding = "AI"

# D1 database (SQLite, free) — progress sync + study rooms
# NOTE: pehle `wrangler d1 create boardprep` chalao, phir mila id yahan REPLACE_ME ki jagah likho
[[d1_databases]]
binding = "DB"
database_name = "boardprep"
database_id = "6ce2b8b9-36c8-4b39-91d2-4d811a5f9ed9"
