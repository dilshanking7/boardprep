name = "boardprep-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Free model (Nous Portal) — longcat-2.5:free
[vars]
MODEL = "meituan/longcat-2.5:free"
INFERENCE_BASE_URL = "https://inference-api.nousresearch.com/v1"
NOUS_PORTAL = "https://portal.nousresearch.com"
SUPABASE_URL = "https://qssxnilqflpzlyflfoqk.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_5Kto_b2Fmp4SRww7qvPaeA_SetAlfDV"

# rate limit — 60 AI requests per logged-in user, 24 hour window
LIMIT_PER = "60"
WINDOW_HOURS = "24"

# Security — only these origins can call the API (no '*').
# Localhost on any port is allowed by a regex in code; the APK origin is included.
ALLOWED_ORIGINS = "https://dilshanking7.github.io,http://localhost,http://127.0.0.1,https://appassets.androidplatform.net,http://appassets.androidplatform.net"

# Free keys (optional — the chain uses whatever is available)
# GROQ_KEY, GEMINI_KEY, OPENROUTER_KEY -> Wrangler secret or var
# NOUS_TOKEN, NOUS_REFRESH_TOKEN, NOUS_CLIENT_ID -> Wrangler secret (better than D1)
# DIAG_TOKEN -> optional; /api/diag runs only when it is set

# Cloudflare Workers AI (free tier — requires a Cloudflare account)
[ai]
binding = "AI"

# D1 database (SQLite, free tier) — progress sync and study rooms
# NOTE: run `wrangler d1 create boardprep` first, then replace REPLACE_ME with the returned ID
[[d1_databases]]
binding = "DB"
database_name = "boardprep"
database_id = "6ce2b8b9-36c8-4b39-91d2-4d811a5f9ed9"
